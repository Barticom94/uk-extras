name: Free channels

# Rebuilds the free channel files (now and next changes hourly) and deploys the whole site to GitHub Pages.
# Nothing is committed: the downloads and the built JSON live only in the Pages artifact.
on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test
        run: python3 -I test_build.py
      - name: Build the free channels
        run: python3 -I build_channels.py _site
      - name: Check every tile opens and plays
        run: python3 -I validate.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
