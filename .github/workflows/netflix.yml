name: Netflix rows

# Netflix publishes its Top 10 files weekly (usually Tuesday). Wednesday's run picks them up;
# Friday's catches a late file. Commits only when the rows changed, then redeploys the site.
on:
  schedule:
    - cron: "30 9 * * 3"
    - cron: "30 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: netflix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Netflix rows
        # 75: Netflix or IMDb still down after the retries; the rows stay as they are and the next run tries again
        run: python3 -I build_netflix.py || { code=$?; [ "$code" -eq 75 ] || exit "$code"; }
      - name: Commit and redeploy if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/catalog netflix_matches.txt
          if git diff --cached --quiet; then echo "Rows unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"  # in config, not -c: a rebase that replays the commit needs it too
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Netflix rows for $(date -u +%F)"
          # GitHub sometimes refuses a push (500): rebase onto anything pushed since the checkout and try again
          for try in 1 2 3; do
            git pull --rebase -q origin main && git push && break
            [ "$try" -eq 3 ] && exit 1
            sleep 60
          done
          # the next Free channels run (every 3 hours) deploys the new rows anyway; this only gets them out sooner
          gh workflow run free-channels.yml --ref main || echo "::warning::redeploy not started; the next Free channels run deploys the rows"
